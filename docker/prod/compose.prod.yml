services:
  app:
    image: ${DOCKER_USERNAME:-cativo23}/tcg-vault:latest
    restart: unless-stopped
    env_file: [.env]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/up"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    volumes:
      - collection-photos-data:/var/www/html/storage/app/public/collection-photos
    networks: [space-server_web, tcgvault-internal]
    deploy:
      resources:
        limits: { cpus: '1.0', memory: 192M }
        reservations: { cpus: '0.1', memory: 96M }
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.tcgvault.rule=Host(`tcgvault.cativo.dev`)"
      - "traefik.http.routers.tcgvault.entrypoints=websecure"
      - "traefik.http.routers.tcgvault.tls.certresolver=letsencryptresolver"
      - "traefik.http.routers.tcgvault.middlewares=security-headers@file"
      - "traefik.http.services.tcgvault.loadbalancer.server.port=8080"
      - "traefik.docker.network=space-server_web"

  horizon:
    image: ${DOCKER_USERNAME:-cativo23}/tcg-vault:latest
    restart: unless-stopped
    env_file: [.env]
    command: ["php", "artisan", "horizon"]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    # The base image bakes in a default HTTP healthcheck (curl localhost:8080)
    # — meaningless here, since this container never runs nginx/php-fpm, only
    # `php artisan horizon`. Left enabled it never resolves, staying
    # "starting" then flipping permanently "unhealthy" despite the queue
    # actually working fine. Disable it explicitly rather than let it lie.
    healthcheck:
      disable: true
    networks: [tcgvault-internal]
    deploy:
      resources:
        limits: { cpus: '0.5', memory: 128M }
        reservations: { cpus: '0.1', memory: 64M }

  scheduler:
    image: ${DOCKER_USERNAME:-cativo23}/tcg-vault:latest
    restart: unless-stopped
    env_file: [.env]
    command: ["php", "artisan", "schedule:work"]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    # Same reasoning as horizon above — no HTTP server in this container.
    healthcheck:
      disable: true
    networks: [tcgvault-internal]
    deploy:
      resources:
        limits: { cpus: '0.25', memory: 64M }
        reservations: { cpus: '0.05', memory: 32M }

  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes: [pgdata:/var/lib/postgresql/data]
    networks: [tcgvault-internal]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    deploy:
      resources:
        limits: { cpus: '1.0', memory: 192M }
        reservations: { cpus: '0.1', memory: 96M }

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD?Missing REDIS_PASSWORD}"]
    volumes: [redis-data:/data]
    networks: [tcgvault-internal]
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    deploy:
      resources:
        limits: { cpus: '0.5', memory: 64M }
        reservations: { cpus: '0.05', memory: 32M }

networks:
  space-server_web:
    external: true
  tcgvault-internal:
    driver: bridge
    internal: true

volumes:
  pgdata:
    driver: local
  redis-data:
    driver: local
  collection-photos-data:
    driver: local
