name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

# A second push to the same PR/branch supersedes the first's result, so
# cancel the stale run instead of letting both finish.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: root
          POSTGRES_DB: testing
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U root -d testing"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: "8.4"
          extensions: intl, pgsql, pdo_pgsql, redis
          coverage: none

      # Caches Composer's own download cache, not vendor/ itself — so a
      # cache hit only ever skips a network fetch, never substitutes
      # already-built package files. composer install still runs in full
      # every time and reconciles everything against composer.lock, which
      # is what protects this from cache-poisoning (a stale/tampered cache
      # entry can't get vendor/ files loaded without going through that
      # reconciliation first).
      - name: Cache Composer download cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cache/composer
          key: composer-${{ runner.os }}-${{ hashFiles('composer.lock') }}
          restore-keys: composer-${{ runner.os }}-

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Check code style (Pint)
        run: vendor/bin/pint --test

      - name: Use Node.js 24.x
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24
          cache: npm

      - name: Install npm dependencies
        run: npm ci

      - name: Build front-end assets
        run: npm run build

      - name: Copy environment file
        run: cp .env.example .env

      - name: Generate application key
        run: php artisan key:generate

      - name: Run test suite
        env:
          # .env.example points at Sail's "pgsql" compose service name,
          # which doesn't resolve here — the service container above is
          # reachable at 127.0.0.1 with the same root/no-password/testing
          # credentials Sail uses locally.
          DB_CONNECTION: pgsql
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          DB_DATABASE: testing
          DB_USERNAME: root
          DB_PASSWORD: ""
        run: composer test

  # Builds the same image deploy.yml ships, without pushing, so a broken
  # Dockerfile or a production-only build failure shows up on the pull
  # request instead of mid-deploy. Uses the Actions cache rather than the
  # Docker Hub build cache so it needs no registry credentials — pull
  # request code never gets the prod environment's secrets.
  image:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Build production image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: ./docker/prod/Dockerfile
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
