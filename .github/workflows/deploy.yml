name: Deploy

# Deploys to production when a GitHub Release is published — which only
# happens when a release/vX.Y.Z branch is merged into master (auto-release.yml).
on:
  release:
    types: [published]

jobs:
  build:
    runs-on: ubuntu-latest
    environment: prod
    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Login to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ${{ secrets.DOCKER_USERNAME }}/tcg-vault
          tags: |
            type=raw,value=${{ github.event.release.tag_name }}
            type=raw,value=latest
            type=sha

      - name: Build and push Docker image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: ./docker/prod/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=registry,ref=${{ secrets.DOCKER_USERNAME }}/tcg-vault:buildcache
          cache-to: type=registry,ref=${{ secrets.DOCKER_USERNAME }}/tcg-vault:buildcache,mode=max

  deploy:
    name: Deploy to polaris2
    needs: build
    runs-on: ubuntu-latest
    environment: prod
    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.event.release.tag_name }}

      # compose.prod.yml already lives on the server under ~/deploy/tcg-vault
      # with its own .env (APP_KEY, DB_PASSWORD, REDIS_PASSWORD, RESEND_KEY —
      # see deploy/README.md's one-time setup). Only the compose file is
      # re-synced here, so it stays current if this repo's version changes;
      # the server's .env is never touched or regenerated by this workflow.
      - name: Copy compose file to server
        uses: appleboy/scp-action@ff85246acaad7bdce478db94a363cd2bf7c90345 # v1
        with:
          host: ${{ vars.DEPLOY_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ vars.DEPLOY_PORT }}
          source: "docker/prod/compose.prod.yml"
          target: "~/deploy/tcg-vault"
          strip_components: 2
          debug: true
          timeout: 10m
          command_timeout: 10m
          proxy_timeout: 10m

      - name: Deploy to server
        uses: appleboy/ssh-action@029f5b4aeeeb58fdfe1410a5d17f967dacf36262 # v1.0.3
        env:
          # Pins the deployment to the exact image this job just built and
          # pushed, not the mutable :latest tag — :latest can be
          # overwritten by any later push (another release, a manual
          # rebuild) between this job finishing and the next `pull`
          # running, so relying on it for what actually gets deployed
          # isn't a reliable link back to this release's build/test run.
          IMAGE_TAG: ${{ github.event.release.tag_name }}
        with:
          host: ${{ vars.DEPLOY_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ vars.DEPLOY_PORT }}
          envs: DOCKER_USERNAME,IMAGE_TAG
          script: |
            export DOCKER_USERNAME="${{ secrets.DOCKER_USERNAME }}"
            echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${DOCKER_USERNAME}" --password-stdin

            cd ~/deploy/tcg-vault

            docker compose -f compose.prod.yml pull
            docker compose -f compose.prod.yml up -d
            docker image prune -f

            echo "=== Deployed image tags ==="
            docker compose -f compose.prod.yml images

            echo ""
            echo "!!! Migrations are never auto-run. If this release includes"
            echo "!!! new migrations, run manually:"
            echo "!!!   docker compose -f compose.prod.yml exec app php artisan migrate --force"
            echo "!!!   docker compose -f compose.prod.yml exec app php artisan db:seed"

            echo ""
            echo "=== Recent logs ==="
            docker compose -f compose.prod.yml logs --tail=50
