name: Deploy

# Deploys to production when a GitHub Release is published — which only
# happens when a release/vX.Y.Z branch is merged into master (auto-release.yml).
on:
  release:
    types: [published]

# Two releases published close together would otherwise race on the same
# ~/deploy/tcg-vault directory (one scp-ing compose.prod.yml while the
# other runs `up -d`). Queue rather than cancel — a deploy already in
# flight should finish, not get cut mid-`up -d`.
concurrency:
  group: deploy-prod
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    environment: prod
    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Login to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          username: ${{ vars.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ${{ vars.DOCKER_USERNAME }}/tcg-vault
          tags: |
            type=raw,value=${{ github.event.release.tag_name }}
            type=raw,value=latest,enable=${{ !github.event.release.prerelease }}
            type=sha

      - name: Build and push Docker image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: ./docker/prod/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=registry,ref=${{ vars.DOCKER_USERNAME }}/tcg-vault:buildcache
          cache-to: type=registry,ref=${{ vars.DOCKER_USERNAME }}/tcg-vault:buildcache,mode=max

  deploy:
    name: Deploy to polaris2
    needs: build
    runs-on: ubuntu-latest
    environment: prod
    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.event.release.tag_name }}

      # compose.prod.yml already lives on the server under ~/deploy/tcg-vault
      # with its own .env (APP_KEY, DB_PASSWORD, REDIS_PASSWORD, RESEND_KEY —
      # see deploy/README.md's one-time setup). Only the compose file is
      # re-synced here, so it stays current if this repo's version changes;
      # the server's .env is never touched or regenerated by this workflow.
      - name: Copy compose file to server
        uses: appleboy/scp-action@ff85246acaad7bdce478db94a363cd2bf7c90345 # v1
        with:
          host: ${{ vars.DEPLOY_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ vars.DEPLOY_PORT }}
          source: "docker/prod/compose.prod.yml"
          target: "~/deploy/tcg-vault"
          strip_components: 2
          debug: true
          timeout: 10m
          command_timeout: 10m
          proxy_timeout: 10m

      - name: Deploy to server
        uses: appleboy/ssh-action@029f5b4aeeeb58fdfe1410a5d17f967dacf36262 # v1.0.3
        env:
          # Pins the deployment to the exact image this job just built and
          # pushed, not the mutable :latest tag — :latest can be
          # overwritten by any later push (another release, a manual
          # rebuild) between this job finishing and the next `pull`
          # running, so relying on it for what actually gets deployed
          # isn't a reliable link back to this release's build/test run.
          IMAGE_TAG: ${{ github.event.release.tag_name }}
          # Templating secrets.* directly into the script string (as this
          # used to do) means a token containing a quote, backtick, $, or
          # newline breaks or partially executes in the remote shell.
          # Routed through env:/envs: instead, so appleboy/ssh-action
          # delivers them as real remote environment variables.
          DOCKER_USERNAME: ${{ vars.DOCKER_USERNAME }}
          DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
        with:
          host: ${{ vars.DEPLOY_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ vars.DEPLOY_PORT }}
          envs: IMAGE_TAG,DOCKER_USERNAME,DOCKER_PASSWORD
          script: |
            # Fails loud instead of silently falling back to compose.prod.yml's
            # own `:-latest` default — appleboy/ssh-action's `envs:` passthrough
            # not delivering IMAGE_TAG would otherwise deploy the mutable
            # :latest tag exactly like before this pipeline existed, but
            # reported as a successful, correctly-tagged release.
            : "${IMAGE_TAG:?IMAGE_TAG not propagated to the server — refusing to deploy :latest}"

            echo "$DOCKER_PASSWORD" | docker login -u "$DOCKER_USERNAME" --password-stdin

            cd ~/deploy/tcg-vault

            docker compose -f compose.prod.yml pull

            echo "!!! Migrations are never auto-run. If this release includes"
            echo "!!! new migrations, run manually BEFORE traffic hits the new"
            echo "!!! code (see below):"
            echo "!!!   docker compose -f compose.prod.yml exec app php artisan migrate --force"
            echo "!!!   docker compose -f compose.prod.yml exec app php artisan db:seed"

            # Read-only status check against the *new* image, before it's
            # running — up -d would otherwise start serving requests on the
            # new code immediately, ahead of any pending migration a human
            # hasn't run yet, and Horizon would start draining the queue
            # against the old schema. Refuse to bring the new code up in
            # that state; run the migration and re-publish/redeploy instead.
            PENDING=$(docker compose -f compose.prod.yml run --rm --no-deps app php artisan migrate:status 2>&1 | grep -c "Pending" || true)
            if [ "$PENDING" -gt 0 ]; then
              echo "::error::$PENDING pending migration(s) on the new image — refusing to start it. Run the migrate command above manually, then redeploy."
              exit 1
            fi

            docker compose -f compose.prod.yml up -d
            docker image prune -f

            echo "=== Waiting for app to report healthy ==="
            for i in $(seq 1 20); do
              STATUS=$(docker inspect --format='{{.State.Health.Status}}' "$(docker compose -f compose.prod.yml ps -q app)" 2>/dev/null || echo "unknown")
              if [ "$STATUS" = "healthy" ]; then
                echo "app is healthy."
                break
              fi
              if [ "$i" -eq 20 ]; then
                echo "::error::app did not report healthy within ~100s — deploy did not verify, check logs below."
                docker compose -f compose.prod.yml logs --tail=100 app
                exit 1
              fi
              echo "app status: $STATUS (attempt $i/20)…"
              sleep 5
            done

            echo "=== Deployed image tags ==="
            docker compose -f compose.prod.yml images

            echo ""
            echo "=== Recent logs ==="
            docker compose -f compose.prod.yml logs --tail=50
